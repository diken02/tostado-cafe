<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú · Tostado</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-title="Menú">
<main id="app">
<div class="page-head"><div><h1>Edición del menú</h1><p>Administra productos, precios y disponibilidad</p></div></div>
<div class="grid cols-2" style="grid-template-columns:2fr 1fr">
<div class="card"><div class="filters"><input type="search" placeholder="Buscar producto..."><select><option>Todas las categorías</option><option>Bebidas calientes</option><option>Bebidas frías</option><option>Postres</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody>
<tr><td>☕ Espresso</td><td>Bebidas calientes</td><td>$3.00</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>☕ Capuchino</td><td>Bebidas calientes</td><td>$4.50</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>🥤 Café frío</td><td>Bebidas frías</td><td>$5.00</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>🥐 Croissant</td><td>Panadería</td><td>$3.50</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>🍰 Cheesecake</td><td>Postres</td><td>$5.50</td><td><span class="badge warn">Pausado</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
</tbody></table></div></div>
<form class="card"><h3>Editar producto</h3>
<div class="form-row"><label>Nombre</label><input value="Capuchino"></div>
<div class="form-row"><label>Categoría</label><select><option>Bebidas calientes</option><option>Bebidas frías</option><option>Postres</option></select></div>
<div class="form-row"><label>Precio</label><input value="4.50"></div>
<div class="form-row"><label>Descripción</label><textarea rows="3">Espresso con leche vaporizada y espuma cremosa.</textarea></div>
<div class="form-row"><label>Disponibilidad</label><select><option>Activo</option><option>Pausado</option></select></div>
<button type="button" class="btn block">Guardar cambios</button> <button type="button" class="btn secondary block" style="margin-top:.5rem">Cancelar</button></form>
</div>
</main>
<script src="js/app.js?v=4"></script>
<script>
(async function(){
 if(!window.tostadoToken){location.href="index.html";return;}
 document.querySelector("main").innerHTML='<div class="page-head"><div><h1>Edición del menú</h1><p>Productos, precios, fotos y disponibilidad</p></div><button class="btn" id="newProduct">+ Nuevo producto</button></div>'+
 '<div class="grid cols-2" style="grid-template-columns:2fr 1fr"><div class="card"><div class="filters"><input id="productSearch" placeholder="Buscar producto"></div><div class="table-wrap"><table><thead><tr><th>Foto</th><th>Producto</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody id="productBody"></tbody></table></div></div>'+
 '<form class="card" id="productForm"><h3 id="productTitle">Nuevo producto</h3><div class="form-row"><label>Nombre</label><input id="pName" required></div><div class="form-row"><label>Categoría</label><input id="pCategory" required></div><div class="form-row"><label>Precio</label><input id="pPrice" type="number" min="0" step="0.01" required></div><div class="form-row"><label>Descripción</label><textarea id="pDesc" rows="3"></textarea></div><div class="form-row"><label>Foto (URL o ruta)</label><input id="pImage" placeholder="images/producto.jpg"><img id="pPreview" style="max-width:100%;max-height:180px;object-fit:cover;margin-top:8px;border-radius:10px"></div><div class="form-row"><label>Disponible</label><select id="pAvailable"><option value="1">Sí</option><option value="0">No</option></select></div><button class="btn block">Guardar</button></form></div>';
 var editing=null,products=[];
 async function load(){var r=await tostadoApiFetch("/api/admin/productos");var d=await r.json();if(!r.ok)throw new Error(d.error);products=d;render();}
 function escapeHtml(value){return String(value == null ? "" : value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
 function render(){var q=document.getElementById("productSearch").value.toLowerCase();document.getElementById("productBody").innerHTML=products.filter(function(p){return p.nombre.toLowerCase().includes(q)}).map(function(p){
  var img=p.imagen?'<img src="'+p.imagen+'" style="width:48px;height:48px;object-fit:cover;border-radius:8px">':'Sin foto';
  return '<tr><td>'+img+'</td><td><strong>'+escapeHtml(p.nombre)+'</strong><br><small>'+escapeHtml(p.categoria)+'</small></td><td>$'+Number(p.precio).toFixed(2)+'</td><td><span class="badge '+(p.disponible?'ok':'danger')+'">'+(p.disponible?'Activo':'Pausado')+'</span></td><td><button type="button" class="btn secondary sm edit-product" data-id="'+p.id+'">Editar</button> <button type="button" class="btn secondary sm delete-product" data-id="'+p.id+'">Eliminar</button></td></tr>';
 }).join("");}
 document.getElementById("productSearch").oninput=render;
 document.getElementById("pImage").oninput=function(){pPreview.src=this.value};
 document.getElementById("newProduct").onclick=function(){editing=null;productTitle.textContent="Nuevo producto";productForm.reset();pPreview.removeAttribute("src");};
 document.getElementById("productBody").onclick=async function(e){
  var editButton=e.target.closest(".edit-product");
  var deleteButton=e.target.closest(".delete-product");
  if(editButton){var selectedProduct=products.find(function(product){return String(product.id)==editButton.dataset.id});if(!selectedProduct)return;editing=selectedProduct.id;productTitle.textContent="Editar producto";pName.value=selectedProduct.nombre;pCategory.value=selectedProduct.categoria;pPrice.value=selectedProduct.precio;pDesc.value=selectedProduct.descripcion||"";pImage.value=selectedProduct.imagen||"";pPreview.src=selectedProduct.imagen||"";pAvailable.value=selectedProduct.disponible?"1":"0";}
  if(deleteButton&&confirm("¿Eliminar este producto del menú?")){var response=await tostadoApiFetch("/api/productos/"+deleteButton.dataset.id,{method:"DELETE"});var data=await response.json();if(!response.ok)return alert(data.error);editing=null;load();}
 };
 productForm.onsubmit=async function(e){e.preventDefault();var body={nombre:pName.value.trim(),categoria:pCategory.value.trim(),precio:Number(pPrice.value),descripcion:pDesc.value.trim(),imagen:pImage.value.trim(),disponible:pAvailable.value==="1"};var r=await tostadoApiFetch(editing?"/api/productos/"+editing:"/api/productos",{method:editing?"PATCH":"POST",body:JSON.stringify(body)});var d=await r.json();if(!r.ok)return alert(d.error);editing=null;load();};
 load().catch(function(e){alert(e.message)});
})();
</script>
</body>
</html>
