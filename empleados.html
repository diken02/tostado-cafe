<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empleados · Tostado</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-title="Cuentas">
<main id="app">
<div class="page-head"><div><h1>Empleados</h1><p>Equipo de Tostado</p></div><button class="btn">+ Nuevo empleado</button></div>
<div class="grid cols-2" style="grid-template-columns:2fr 1fr">
<div class="card"><div class="filters"><input type="search" placeholder="Buscar empleado..."><select><option>Todos los roles</option><option>Administrador</option><option>Barista</option><option>Mesero</option><option>Cajero</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Turno</th><th>Estado</th><th></th></tr></thead><tbody>
<tr><td>Ana Torres</td><td>Administradora</td><td>Mañana</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>Luis Mendoza</td><td>Barista</td><td>Mañana</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>Carla Ríos</td><td>Mesera</td><td>Tarde</td><td><span class="badge ok">Activo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>Jorge Salas</td><td>Cajero</td><td>Tarde</td><td><span class="badge warn">Vacaciones</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
<tr><td>Marta Lugo</td><td>Barista</td><td>Noche</td><td><span class="badge danger">Inactivo</span></td><td><button class="btn secondary sm">Editar</button></td></tr>
</tbody></table></div></div>
<form class="card"><h3>Nuevo empleado</h3>
<div class="form-row"><label>Nombre completo</label><input placeholder="Nombre y apellido"></div>
<div class="form-row"><label>Correo</label><input type="email" placeholder="correo@tostado.com"></div>
<div class="form-row"><label>Rol</label><select><option>Barista</option><option>Mesero</option><option>Cajero</option><option>Administrador</option></select></div>
<div class="form-row"><label>Turno</label><select><option>Mañana</option><option>Tarde</option><option>Noche</option></select></div>
<button type="button" class="btn block">Guardar</button></form>
</div>
</main>
<script src="js/app.js?v=4"></script>
<script>
(async function(){
 if(!window.tostadoToken){location.href="index.html";return;}
 document.querySelector("main").innerHTML='<div class="page-head"><div><h1>Empleados</h1><p>Editar roles, turnos, contraseñas y acceso</p></div><button class="btn" id="newEmployee">+ Nuevo empleado</button></div>'+
 '<div class="card"><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Turno</th><th>Estado</th><th></th></tr></thead><tbody id="employeeBody"></tbody></table></div></div>'+
 '<dialog id="employeeDialog" style="border:0;border-radius:12px;padding:20px"><form id="employeeForm"><h3 id="employeeTitle">Nuevo empleado</h3><div class="form-row"><label>Nombre</label><input id="employeeName" required></div><div class="form-row"><label>Usuario</label><input id="employeeUser" required></div><div class="form-row"><label>Contraseña</label><input id="employeePassword" type="password" placeholder="Dejar vacío para conservar"></div><div class="form-row"><label>Rol</label><select id="employeeRole"><option>administrador</option><option>cajero</option><option>barista</option><option>mesero</option></select></div><div class="form-row"><label>Turno</label><select id="employeeShift"><option>mañana</option><option>tarde</option><option>noche</option></select></div><div class="form-row"><label>Activo</label><select id="employeeActive"><option value="1">Sí</option><option value="0">No</option></select></div><button class="btn">Guardar</button> <button type="button" class="btn secondary" onclick="employeeDialog.close()">Cerrar</button></form></dialog>';
 var editing=null,employees=[];
 async function load(){var r=await tostadoApiFetch("/api/empleados");var d=await r.json();if(!r.ok)throw new Error(d.error);employees=d;employeeBody.innerHTML=d.map(function(e){
  return '<tr><td>'+e.nombre+'</td><td>'+e.usuario+'</td><td>'+e.rol+'</td><td>'+e.turno+'</td><td><span class="badge '+(e.activo?'ok':'danger')+'">'+(e.activo?'Activo':'Inactivo')+'</span></td><td><button class="btn secondary sm edit-employee" data-id="'+e.id+'">Editar</button> <button class="btn secondary sm delete-employee" data-id="'+e.id+'">Eliminar</button></td></tr>';
 }).join("");}
 newEmployee.onclick=function(){editing=null;employeeTitle.textContent="Nuevo empleado";employeeForm.reset();employeeShift.value="mañana";employeeDialog.showModal()};
 employeeBody.onclick=async function(e){
  var edit=e.target.closest(".edit-employee"),remove=e.target.closest(".delete-employee");
  if(edit){var x=employees.find(function(v){return String(v.id)==edit.dataset.id});editing=x.id;employeeTitle.textContent="Editar empleado";employeeName.value=x.nombre;employeeUser.value=x.usuario;employeeRole.value=x.rol;employeeShift.value=x.turno||"mañana";employeeActive.value=x.activo?"1":"0";employeePassword.value="";employeeDialog.showModal();}
  if(remove&&confirm("¿Eliminar permanentemente este empleado?")){var r=await tostadoApiFetch("/api/empleados/"+remove.dataset.id,{method:"DELETE"});var d=await r.json();if(!r.ok)return alert(d.error);load();}
 };
 employeeForm.onsubmit=async function(e){e.preventDefault();var body={nombre:employeeName.value.trim(),usuario:employeeUser.value.trim(),password:employeePassword.value,rol:employeeRole.value,turno:employeeShift.value,activo:employeeActive.value==="1"};var r=await tostadoApiFetch(editing?"/api/empleados/"+editing:"/api/empleados",{method:editing?"PATCH":"POST",body:JSON.stringify(body)});var d=await r.json();if(!r.ok)return alert(d.error);employeeDialog.close();load();}
 load().catch(function(e){alert(e.message)});
})();
</script>
</body>
</html>
